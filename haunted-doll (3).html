function hs(i,j){let h=Math.imul(i,374761393)^Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0}

function rnd(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function spr(rows,pal,s){return mkc(rows[0].length*s,rows.length*s,x=>rows.forEach((r,yy)=>[...r].forEach((ch,xx)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(xx*s,yy*s,s,s)}})))}
function mkGround(seed,base,cols,blades,pebble){return mkc(64,64,x=>{const r=rnd(seed);x.fillStyle=base;x.fillRect(0,0,64,64);for(let a=0;a<16;a++)for(let b=0;b<16;b++){const v=r();if(v<.2){x.fillStyle=cols[0];x.fillRect(a*4,b*4,4,4)}else if(v<.3){x.fillStyle=cols[1];x.fillRect(a*4,b*4,4,4)}}
 if(pebble){for(let k=0;k<4;k++){x.fillStyle=cols[2];x.fillRect(Math.floor(r()*15)*4,Math.floor(r()*15)*4,8,4)}}
 for(let k=0;k<(blades?7:2);k++){const a=Math.floor(r()*15)*4,b=Math.floor(2+r()*13)*4;x.fillStyle='#4a6455';x.fillRect(a,b-8,4,8);x.fillStyle='#37503f';x.fillRect(a+4,b-4,4,4);x.fillRect(a-4,b-4,4,4)}})}
